name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 🔐 Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed keys and .env files
        run: bash scripts/check-secrets.sh

  contracts:
    name: ⛓️ Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: yarn compile

      - name: Run tests
        working-directory: packages/foundry
        run: forge test -vvv

      - name: Check formatting (run `yarn foundry:format` to fix)
        continue-on-error: true
        working-directory: packages/foundry
        run: forge fmt --check

  frontend:
    name: 🖥️ Frontend (lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Deploy contracts to a local chain (regenerates ABIs)
        run: |
          yarn chain > anvil.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null && break
            sleep 1
          done
          yarn deploy

      - name: Lint
        run: yarn next:lint --max-warnings=0

      - name: Type check
        run: yarn next:check-types
